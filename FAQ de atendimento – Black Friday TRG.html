*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--sticky-h) + 12px)}
body{margin:0;background:var(--paper);color:var(--ink);

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* Cabeçalho */
.masthead{padding-top:32px;padding-bottom:8px}
.masthead h1{font:650 clamp(28px,4.2vw,42px)/1.05 "Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  letter-spacing:-.02em;margin:0 0 8px;max-width:22ch}
.masthead p{margin:0;color:var(--ink-2);max-width:62ch}

/* Barra fixa de busca */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:16px 0 12px;
  border-bottom:1px solid transparent;transition:border-color .2s}
.bar.stuck{border-bottom-color:var(--line)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--ink);
  border-radius:14px;padding:0 10px 0 16px;min-height:58px}
.search:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 30%,transparent)}
.search svg{flex:none;width:22px;height:22px;color:var(--ink-2)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:19px;line-height:1.3;font-family:inherit;padding:14px 0;outline:none}
.search input::placeholder{color:var(--ink-2);opacity:.85}
.search input::-webkit-search-cancel-button{display:none}
.search kbd{font:inherit;font-size:13px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px}
.search .clear{border:0;background:transparent;color:var(--ink-2);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:15px}
.search .clear:hover{color:var(--ink);background:var(--surface-2)}
.understood{margin:10px 2px 0;font-size:14.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.understood .k{border-bottom:1.5px solid var(--mark);color:var(--ink);padding:0 1px;margin-right:4px}
.understood .k.rel{border-bottom-style:dotted;color:var(--ink-2)}
.prods{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);
  border-radius:999px;padding:6px 13px;font-size:14.5px;cursor:pointer;line-height:1.2}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.chip[disabled]{opacity:.45;cursor:default}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}

/* Layout */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;padding-top:20px;padding-bottom:64px}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr);gap:0}.toc-d{display:none}}
@media (min-width:961px){.toc-m{display:none}}
.toc-d{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--sticky-h) + 12px);align-self:start;
  max-height:calc(100vh - var(--sticky-h) - 32px);overflow:auto;padding-right:6px;font-size:14.5px}
.toc-p{margin:0 0 18px}
.toc-p > button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;

.toc-p ul{list-style:none;margin:2px 0 0;padding:0 0 0 23px}
.toc-p li button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;

.toc-p li .n{font-variant-numeric:tabular-nums;opacity:.8}

.toc-m summary{padding:12px 16px;cursor:pointer;font-weight:700}
.toc-m .toc-inner{padding:4px 12px 12px}

.status{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.status p{margin:0;color:var(--ink-2)}
.status strong{color:var(--ink)}
.tools{display:flex;gap:8px}
.tbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14.5px}
.tbtn:hover{border-color:var(--ink-2)}
.shortcuts{margin:0 0 26px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.shortcuts span{color:var(--ink-2);font-size:14.5px;margin-right:2px}

.answer p:last-child{margin-bottom:0}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}

.qa-foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:16px}

.rhead:first-child{margin-top:0}

.empty p{margin:0 0 10px}

footer.foot{border-top:1px solid var(--line);padding-top:22px;padding-bottom:40px;color:var(--ink-2);font-size:14.5px}

footer.foot p{margin:0 0 8px;max-width:80ch}
@media (max-width:600px){
  .wrap{padding:0 14px}

a linguagem simbólica por meio da qual nossas emoções, pensamentos, atitudes e conflitos internos se expressam fisicamente."],"kw":"sobre curso importante vantagem diferencial temas conteudo psicossomatica"},{"id":"PSI-002","p":"psico","topic":"Sobre o curso","n":2,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"Por que saber sobre Psicossomática é importante para meu trabalho como terapeuta?","q":"Por que saber sobre Psicossomática é importante para meu trabalho como terapeuta?","v":[],"a":["A Psicossomática revela desequilíbrios na forma como lidamos com a vida: emoções reprimidas, padrões de pensamento destrutivos, negação de si mesmo, conflitos não resolvidos. Sabendo mais sobre Psicossomática é possível aprimorar muito o seu atendimento aos clientes."],"kw":"sobre curso importante vantagem diferencial temas conteudo psicossomatica"},{"id":"PSI-003","p":"psico","topic":"Sobre o curso","n":3,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"Por que o curso de Psicossomática é importante para mim como terapeuta? | Por que eu deveria fazer o curso de Psicossomática?","q":"Por que o curso de Psicossomática é importante para mim como terapeuta?","v":["Por que eu deveria fazer o curso de Psicossomática?"],"a":["O professor Jair considera a Psicossomática o terceiro superpoder do terapeuta TRG. Com ela, você amplia o seu olhar sobre a possível relação entre as emoções e os sintomas físicos que seus clientes relatam. Isso torna a sua escuta mais completa e ajuda você a considerar, nos atendimentos, uma dimensão que muitas vezes passa despercebida, sempre de forma complementar ao acompanhamento médico."],"kw":"sobre curso importante vantagem diferencial temas conteudo psicossomatica"},{"id":"PSI-004","p":"psico","topic":"Sobre o curso","n":4,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"No que o curso de Psicossomática vai me ajudar como terapeuta?","q":"No que o curso de Psicossomática vai me ajudar como terapeuta?","v":[],"a":["O curso de Psicossomática ajuda você a compreender como emoções, pensamentos e conflitos internos podem se expressar no corpo. Com esse conhecimento, você passa a considerar, nos seus atendimentos, a possibilidade de um componente emocional em queixas físicas e a explorar essa possibilidade com mais segurança e profundidade. A Psicossomática não substitui o diagnóstico médico: ela amplia o olhar do terapeuta e atua de forma complementar."],"kw":"sobre curso importante vantagem diferencial temas conteudo psicossomatica"},{"id":"PSI-013","p":"psico","topic":"Sobre o curso","n":13,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"No curso de Psicossomática vou aprender a lidar com essas dores de forma mais fácil?","q":"No curso de Psicossomática vou aprender a lidar com essas dores de forma mais fácil?","v":[],"a":["O professor Jair preparou o curso para ser didático e prático. A proposta é que você saia da formação sabendo reconhecer quando uma queixa física pode ter um componente emocional e como explorar essa possibilidade nos seus atendimentos com mais segurança, sempre de forma complementar ao acompanhamento médico."],"kw":"sobre curso importante vantagem diferencial temas conteudo psicossomatica"},{"id":"PSI-014","p":"psico","topic":"Sobre o curso","n":14,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"O curso de Psicossomática agregará valor às minhas consultas como terapeuta?","q":"O curso de Psicossomática agregará valor às minhas consultas como terapeuta?","v":[],"a":["Sim. O curso amplia o seu olhar sobre a possível relação entre emoções e sintomas físicos, o que torna a sua escuta e os seus atendimentos mais completos. É um conhecimento que complementa a sua formação como terapeuta TRG."],"kw":"sobre curso importante vantagem diferencial temas conteudo psicossomatica"},{"id":"PSI-015","p":"psico","topic":"Sobre o curso","n":15,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"O conhecimento em Psicossomática me ajudará no dia a dia de alguma forma?","q":"O conhecimento em Psicossomática me ajudará no dia a dia de alguma forma?","v":[],"a":["Sim. A Psicossomática amplia a sua compreensão sobre como as emoções podem se manifestar no corpo, o que pode ajudar você a cuidar melhor de si mesmo e a olhar de forma mais completa para as pessoas ao seu redor."],"kw":"sobre curso importante vantagem diferencial temas conteudo psicossomatica"},{"id":"PSI-016","p":"psico","topic":"Sobre o curso","n":16,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"Qual o diferencial do curso de Psicossomática?","q":"Qual o diferencial do curso de Psicossomática?","v":[],"a":["O diferencial está na forma como o professor Jair transforma um conhecimento profundo e amplo em um caminho didático e instigante. O aluno desenvolve um segundo olhar: além de aplicar as técnicas, passa a considerar o que pode estar por trás das queixas físicas que os clientes trazem, sempre de forma complementar ao acompanhamento médico."],"kw":"sobre curso importante vantagem diferencial temas conteudo psicossomatica"},{"id":"PSI-022","p":"psico","topic":"Sobre o curso","n":22,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"O curso de Psicossomática é realmente essencial?","q":"O curso de Psicossomática é realmente essencial?","v":[],"a":["O professor Jair considera a Psicossomática o terceiro superpoder do terapeuta TRG. O curso é indicado para terapeutas que desejam ampliar o olhar sobre a possível relação entre emoções e sintomas físicos e aprofundar a sua prática."],"kw":"sobre curso importante vantagem diferencial temas conteudo psicossomatica"},{"id":"PSI-023","p":"psico","topic":"Sobre o curso","n":23,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"Já tenho bastantes clientes. Por que o curso de Psicossomática faria diferença para mim?","q":"Já tenho bastantes clientes. Por que o curso de Psicossomática faria diferença para mim?","v":[],"a":["Mesmo com uma agenda cheia, a Psicossomática acrescenta uma nova camada aos seus atendimentos: o olhar sobre a possível relação entre emoções e queixas físicas. Isso pode tornar a sua escuta mais completa e enriquecer a forma como você conduz cada caso."],"kw":"sobre curso importante vantagem diferencial temas conteudo psicossomatica"},{"id":"PSI-032","p":"psico","topic":"Sobre o curso","n":32,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"Quais temas são abordados no curso de Psicossomática?","q":"Quais temas são abordados no curso de Psicossomática?","v":[],"a":["O curso de Psicossomática foi desenvolvido a partir dos estudos e vivências do professor Jair, criador da TRG, e aborda a possível origem emocional de sintomas físicos. Alguns dos módulos falam sobre os sistemas endócrinos, sistemas digestivos, sistemas imunológicos, etc."],"kw":"sobre curso importante vantagem diferencial temas conteudo psicossomatica"},{"id":"PSI-007","p":"psico","topic":"Leituras psicossomáticas","n":7,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"Quais partes do corpo têm relação com a Psicossomática?","q":"Quais partes do corpo têm relação com a Psicossomática?","v":[],"a":["Na Psicossomática, algumas partes do corpo são estudadas a partir de associações simbólicas com aspectos emocionais. Alguns exemplos:","- os olhos, associados à forma de ver a vida;","- o estômago, associado à capacidade de aceitar;","- as pernas, associadas ao caminhar pela vida;","- o útero, associado à criatividade e ao feminino.","Essas associações são possibilidades de leitura simbólica, e não diagnósticos. Elas são aprofundadas ao longo do curso e nunca substituem a avaliação médica."],"kw":"dor dores corpo sintoma emocional cabeca costas bracos psicossomatica"},{"id":"PSI-008","p":"psico","topic":"Leituras psicossomáticas","n":8,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"Quais são as principais dores estudadas na Psicossomática?","q":"Quais são as principais dores estudadas na Psicossomática?","v":[],"a":["Algumas das dores estudadas na Psicossomática, com as possíveis leituras emocionais associadas a elas, são:","- Dor de cabeça: pode estar associada ao excesso de racionalização, à tentativa de controlar tudo com a mente e à autocrítica severa.","- Dor nas costas: na região lombar, pode estar associada a medo financeiro, insegurança com o futuro ou falta de apoio; na região superior e nos ombros, à sensação de sobrecarga ou de carregar responsabilidades que não são suas.","- Dor nos braços e mãos: pode estar associada à dificuldade em dar ou receber afeto, ao medo de abraçar a vida ou à sensação de impotência.","Essas leituras são possibilidades estudadas pela Psicossomática, e não afirmações. Toda dor deve ser avaliada primeiro por um médico. Muitas outras relações são aprofundadas no curso."],"kw":"dor dores corpo sintoma emocional cabeca costas bracos psicossomatica"},{"id":"PSI-009","p":"psico","topic":"Leituras psicossomáticas","n":9,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"O que a dor de cabeça pode significar para a Psicossomática?","q":"O que a dor de cabeça pode significar para a Psicossomática?","v":[],"a":["Para a Psicossomática, a dor de cabeça pode estar associada ao excesso de racionalização, à tentativa de controlar tudo com a mente e à autocrítica severa. Nessa leitura simbólica, ela pode ser entendida como uma mensagem do tipo “solte o controle”, “pare de se cobrar tanto” ou “dê-se um tempo”.","Isso é uma possibilidade de leitura, e não um diagnóstico: uma dor pode ter muitas causas e deve ser avaliada primeiro por um médico. Essas e outras relações são aprofundadas no curso de Psicossomática."],"kw":"dor dores corpo sintoma emocional cabeca costas bracos psicossomatica"},{"id":"PSI-010","p":"psico","topic":"Leituras psicossomáticas","n":10,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"O que a dor nas costas pode significar para a Psicossomática?","q":"O que a dor nas costas pode significar para a Psicossomática?","v":[],"a":["Para a Psicossomática, a dor nas costas pode ter leituras diferentes para cada região. Na região lombar, pode estar associada a medo financeiro, insegurança com o futuro ou falta de apoio. Na região superior e nos ombros, pode estar associada à sensação de sobrecarga ou de carregar responsabilidades que não são suas. Nessa leitura simbólica, ela pode ser entendida como uma mensagem do tipo “você está carregando peso demais” ou “deixe o que não é seu”.","Isso é uma possibilidade de leitura, e não um diagnóstico: uma dor pode ter muitas causas e deve ser avaliada primeiro por um médico. Essas e outras relações são aprofundadas no curso de Psicossomática."],"kw":"dor dores corpo sintoma emocional cabeca costas bracos psicossomatica"},{"id":"PSI-011","p":"psico","topic":"Leituras psicossomáticas","n":11,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"O que a dor nos braços e nas mãos pode significar para a Psicossomática?","q":"O que a dor nos braços e nas mãos pode significar para a Psicossomática?","v":[],"a":["Para a Psicossomática, a dor nos braços e nas mãos pode estar associada à dificuldade em dar ou receber afeto, ao medo de abraçar a vida ou à sensação de impotência. Nessa leitura simbólica, ela pode ser entendida como uma mensagem do tipo “abra-se ao toque” ou “permita-se segurar ou soltar”.","Isso é uma possibilidade de leitura, e não um diagnóstico: uma dor pode ter muitas causas e deve ser avaliada primeiro por um médico. Essas e outras relações são aprofundadas no curso de Psicossomática."],"kw":"dor dores corpo sintoma emocional cabeca costas bracos psicossomatica"},{"id":"PSI-012","p":"psico","topic":"Leituras psicossomáticas","n":12,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"Como posso saber se uma dor pode ter relação com um fator emocional? | Como saber se uma dor vem de um problema psíquico?","q":"Como posso saber se uma dor pode ter relação com um fator emocional?","v":["Como saber se uma dor vem de um problema psíquico?"],"a":["A Psicossomática nunca parte da conclusão de que uma dor é emocional. O primeiro passo é sempre a avaliação médica. A Psicossomática passa a considerar a possibilidade de um componente emocional, por exemplo, quando os exames não identificam uma causa física, quando o incômodo parece variar com momentos de estresse ou ansiedade, ou quando muda de lugar sem um motivo claro. Mesmo nesses casos, trata-se de uma possibilidade a ser investigada, e não de uma certeza, e o acompanhamento médico deve continuar."],"kw":"dor dores corpo sintoma emocional cabeca costas bracos psicossomatica"},{"id":"PSI-033","p":"psico","topic":"Limites da Psicossomática","n":33,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"A Psicossomática substitui o tratamento médico? | Com a Psicossomática posso dispensar o médico?","q":"A Psicossomática substitui o tratamento médico?","v":["Com a Psicossomática posso dispensar o médico?"],"a":["Não. A Psicossomática é um olhar complementar, que considera a possibilidade de um componente emocional nas queixas físicas. Ela não substitui o diagnóstico nem o tratamento médico, e toda dor ou sintoma deve ser avaliado primeiro por um médico."],"kw":"medico medicacao substitui tratamento diagnostico psicossomatica"},{"id":"PSI-019","p":"psico","topic":"Limites da Psicossomática","n":19,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"Posso prescrever medicações com o curso de Psicossomática?","q":"Posso prescrever medicações com o curso de Psicossomática?","v":[],"a":["Não. O curso de Psicossomática ensina a perceber e compreender melhor a possível relação entre emoções e dores físicas. Qualquer necessidade de medicamento deve ser avaliada e prescrita por um médico."],"kw":"medico medicacao substitui tratamento diagnostico psicossomatica"},{"id":"PSI-020","p":"psico","topic":"Limites da Psicossomática","n":20,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"Tenho medo de afirmar que meu cliente tem uma dor que é emocional. O curso de Psicossomática é para mim?","q":"Tenho medo de afirmar que meu cliente tem uma dor que é emocional. O curso de Psicossomática é para mim?","v":[],"a":["Sim. Na Psicossomática, a relação entre emoção e dor nunca é uma afirmação, e sim uma possibilidade a ser investigada com cuidado e sempre ao lado do acompanhamento médico. O curso é para todos que desejam enxergar melhor essa possível relação e trabalhar com ela de forma responsável."],"kw":"medico medicacao substitui tratamento diagnostico psicossomatica"},{"id":"PSI-025","p":"psico","topic":"Público e pré-requisitos","n":25,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"Quem pode fazer o curso de Psicossomática?","q":"Quem pode fazer o curso de Psicossomática?","v":[],"a":["O curso de Psicossomática foi feito para quem deseja compreender melhor a possível relação entre emoções e dores físicas. No momento, ele é destinado a alunos da formação de Terapeutas TRG."],"kw":"para quem publico requisito quem pode psicossomatica"},{"id":"PSI-026","p":"psico","topic":"Público e pré-requisitos","n":26,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"O curso de Psicossomática tem algum pré-requisito? | O que é preciso para fazer o curso de Psicossomática?","q":"O curso de Psicossomática tem algum pré-requisito?","v":["O que é preciso para fazer o curso de Psicossomática?"],"a":["Sim. Para fazer o curso de Psicossomática é preciso fazer parte da formação de Terapeutas TRG."],"kw":"para quem publico requisito quem pode psicossomatica"},{"id":"PSI-021","p":"psico","topic":"Público e pré-requisitos","n":21,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"O curso de Psicossomática será pré requisito para fazer o Master Terapeuta ?","q":"O curso de Psicossomática será pré requisito para fazer o Master Terapeuta ?","v":[],"a":["Não. O curso de Psicossomática não é pré-requisito para outros cursos. É um curso independente, que complementa a sua formação como terapeuta TRG."],"kw":"para quem publico requisito quem pode psicossomatica"},{"id":"PSI-005","p":"psico","topic":"Aulas, duração e professor","n":5,"src":"RAG_Psicossomatica_neutra.docx","qRaw":"Quem dá as aulas do curso de Psicossomática?","q":"Quem dá as aulas do curso de Psicossomática?","v":[],"a":["As aulas d 6","p":"kids","topic":"Sobre o curso","n":6,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Com o curso aprenderei a conviver e interagir melhor com crianças ou apenas aprenderei a atende-las?","q":"Com o curso aprenderei a conviver e interagir melhor com crianças ou apenas aprenderei a atende-las?","v":[],"a":["No TRG Kids você aprende tanto a atender crianças de forma estruturada quanto a conviver e interagir melhor com elas, porque o curso ensina uma comunicação mais sensível, criativa e empática. O TRG Kids não é apenas um “manual de técnica”, ele também transforma a forma como o terapeuta se relaciona e interage com crianças."],"kw":"sobre curso importante vantagem diferencial temas conteudo trg kids crianca infantil"},{"id":"KID-007","p":"kids","topic":"Sobre o curso","n":7,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Sou mãe/pai. O TRG Kids vai me ajudar a lidar melhor com meu filho(a)?","q":"Sou mãe/pai. O TRG Kids vai me ajudar a lidar melhor com meu filho(a)?","v":[],"a":["O TRG Kids tem uma aula sobre a importância do ambiente familiar para a criança, que mostra como as ações dos pais e o ambiente influenciam a vida emocional dela. Esse conteúdo costuma ser muito útil para quem é mãe ou pai."],"kw":"sobre curso importante vantagem diferencial temas conteudo trg kids crianca infantil"},{"id":"KID-014","p":"kids","topic":"Sobre o curso","n":14,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Não sou criativo para inventar histórias e brincadeiras. Como o TRG Kids vai me ajudar?","q":"Não sou criativo para inventar histórias e brincadeiras. Como o TRG Kids vai me ajudar?","v":[],"a":["No TRG Kids, não se trata de “ter criatividade pronta”, mas de aprender a construí-la dentro de um método seguro e estruturado. O curso ajuda você a despertar e praticar esse lado criativo, para que histórias e brincadeiras fluam de forma natural e alinhada ao protocolo."],"kw":"sobre curso importante vantagem diferencial temas conteudo trg kids crianca infantil"},{"id":"KID-001","p":"kids","topic":"Professor","n":1,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Quem dá as aulas do TRG Kids?","q":"Quem dá as aulas do TRG Kids?","v":[],"a":["As aulas do TRG Kids são ministradas por Charles Dias, indicado pelo professor Jair pela vivência ativa com o público infantil e pela experiência com crianças desde 2008."],"kw":"professor charles dias quem aulas trg kids crianca infantil"},{"id":"KID-002","p":"kids","topic":"Professor","n":2,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Por que o professor Jair não dá as aulas do TRG Kids?","q":"Por que o professor Jair não dá as aulas do TRG Kids?","v":[],"a":["O professor Jair indicou Charles Dias para ministrar as aulas para atendimento infantil pela vivência ativa, por responder sempre as dúvidas dos Terapeutas e por ter um histórico em ministrar aulas para crianças desde 2008. Isso traz uma bagagem para as percepções e entender a necessidade de cada criança."],"kw":"professor charles dias quem aulas trg kids crianca infantil"},{"id":"KID-003","p":"kids","topic":"Professor","n":3,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Quem é Charles Dias?","q":"Quem é Charles Dias?","v":[],"a":["Charles Dias é pai, administrador, especialista em comportamento humano pela FCAP/UPE, Master Terapeuta e especialista em leitura corporal pelo IBFT. Atua com o público infantil desde 2008, unindo sua experiência na educação ao universo terapêutico com foco no desenvolvimento emocional das crianças."],"kw":"professor charles dias quem aulas trg kids crianca infantil"},{"id":"KID-004","p":"kids","topic":"Professor","n":4,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Charles é um Terapeuta TRG ou pedagogo ?","q":"Charles é um Terapeuta TRG ou pedagogo ?","v":[],"a":["Terapeuta TRG e especialista em comportamento humano."],"kw":"professor charles dias quem aulas trg kids crianca infantil"},{"id":"KID-005","p":"kids","topic":"Professor","n":5,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Charles é um terapeuta especializado em crianças ?","q":"Charles é um terapeuta especializado em crianças ?","v":[],"a":["Sim. Charles Dias atua com o público infantil desde 2008, unindo sua experiência na educação ao universo terapêutico com foco no desenvolvimento emocional das crianças."],"kw":"professor charles dias quem aulas trg kids crianca infantil"},{"id":"KID-015","p":"kids","topic":"Público e pré-requisitos","n":15,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Sou terapeuta TRG recém-formado. Preciso ter mais experiência em atendimento antes de fazer o TRG Kids?","q":"Sou terapeuta TRG recém-formado. Preciso ter mais experiência em atendimento antes de fazer o TRG Kids?","v":[],"a":["Você não precisa esperar acumular muita experiência para fazer o TRG Kids. O curso foi desenhado para dar suporte tanto ao terapeuta iniciante quanto ao experiente, oferecendo segurança, recursos práticos e treino criativo."],"kw":"para quem publico requisito quem pode trg kids crianca infantil"},{"id":"KID-009","p":"kids","topic":"Público e pré-requisitos","n":9,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Não me dou bem com crianças. O TRG Kids é para mim?","q":"Não me dou bem com crianças. O TRG Kids é para mim?","v":[],"a":["Se você sente insegurança ou falta de jeito com crianças, o TRG Kids é uma oportunidade de desenvolver essas habilidades. Se for falta de interesse genuíno, pode não ser o momento certo; mas, se houver abertura, o curso pode mudar a sua relação com esse público e enriquecer a sua prática clínica."],"kw":"para quem publico requisito quem pode trg kids crianca infantil"},{"id":"KID-016","p":"kids","topic":"Público e pré-requisitos","n":16,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Não penso em atender crianças. Por que deveria fazer o TRG Kids?","q":"Não penso em atender crianças. Por que deveria fazer o TRG Kids?","v":[],"a":["Se você não pensa em atender crianças, pode parecer que o TRG Kids não faria sentido… mas na prática, há vários motivos estratégicos e profissionais para considerar a formação. O TRG Kids pode ser valioso para enriquecer sua prática terapêutica com adultos, ampliar sua visão sobre famílias, fortalecer seu currículo e preparar você para oportunidades futuras, pois certamente chegará em algum momento de sua vida profissional uma família com um pedido de socorro e você como profissional precisará estar preparado para pelo menos orientar no que deve ser feito."],"kw":"para quem publico requisito quem pode trg kids crianca infantil"},{"id":"KID-011","p":"kids","topic":"Atendimento infantil e mercado","n":11,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Com o TRG Kids vou poder atender crianças muito novas?","q":"Com o TRG Kids vou poder atender crianças muito novas?","v":[],"a":["Sim, desde que a criança tenha linguagem, que é a capacidade de se comunicar. Não é sobre idade. É sobre a capacidade da criança saber informar onde doi, o que aconteceu, o que sente e o que a incomoda."],"kw":"crianca atendimento online consultorio mercado remuneracao idade trg kids crianca infantil"},{"id":"KID-013","p":"kids","topic":"Atendimento infantil e mercado","n":13,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Crianças conseguem ser reprocessadas em atendimento online?","q":"Crianças conseguem ser reprocessadas em atendimento online?","v":[],"a":["Sim, é possível, mas depende muito da idade, da maturidade da criança e do apoio dos pais. O atendimento online tende a funcionar melhor com crianças maiores e adolescentes (a partir de 6 anos), enquanto os menores costumam se beneficiar mais do presencial, onde o lúdico e a relação terapêutica têm mais força."],"kw":"crianca atendimento online consultorio mercado remuneracao idade trg kids crianca infantil"},{"id":"KID-012","p":"kids","topic":"Atendimento infantil e mercado","n":12,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Não tenho um consultório. Como posso atender crianças ?","q":"Não tenho um consultório. Como posso atender crianças ?","v":[],"a":["Você pode começar sem consultório próprio, usando espaços simples ou compartilhados, parcerias estratégicas e até atendimentos online para famílias. O TRG Kids, inclusive, mostra como adaptar recursos lúdicos a diferentes contextos. Você não precisa de uma sala enorme nem de brinquedos caros para fazer um atendimento eficaz. Dependendo da criança e da idade poderá fazer de forma online prontamente."],"kw":"crianca atendimento online consultorio mercado remuneracao idade trg kids crianca infantil"},{"id":"KID-017","p":"kids","topic":"Atendimento infantil e mercado","n":17,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Existe mercado para atendimento de crianças?","q":"Existe mercado para atendimento de crianças?","v":[],"a":["O atendimento infantil é uma área com procura, principalmente por parte de famílias e escolas. Especializar-se nesse público pode ser um diferencial na sua atuação. Como a procura varia muito de região para região, o TRG Kids não promete demanda, mas prepara você para atender crianças com segurança quando ela aparecer."],"kw":"crianca atendimento online consultorio mercado remuneracao idade trg kids crianca infantil"},{"id":"KID-010","p":"kids","topic":"Atendimento infantil e mercado","n":10,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Consigo ser bem remunerado atendendo apenas crianças?","q":"Consigo ser bem remunerado atendendo apenas crianças?","v":[],"a":["A remuneração depende de muitos fatores, como a sua região, o seu posicionamento e a forma como você organiza a sua agenda, por isso não é possível garantir resultados financeiros. O que o TRG Kids oferece é a preparação para atender o público infantil com segurança e método. A procura por terapia infantil costuma vir de famílias e escolas preocupadas com questões emocionais, comportamentais e de aprendizagem."],"kw":"crianca atendimento online consultorio mercado remuneracao idade trg kids crianca infantil"},{"id":"KID-018","p":"kids","topic":"Aulas e duração","n":18,"src":"RAG_TRG_Kids_neutra.docx","qRaw":"Qual o tempo médio de duração do TRG Kids?","q":"Qual o tempo médio de duração do TRG Kids?","v":[], },{"id":"MKT-007","p":"mkt","topic":"Aulas, duração e professor","n":7,"src":"RAG_Marketing_e_Vendas_neutra.docx","qRaw":"Quem dá as aulas do Marketing e Vendas para Terapeutas?","q":"Quem dá as aulas do Marketing e Vendas para Terapeutas?","v":[],"a":["O professor do Curso Marketing e vendas para terapeutas é o Gabriel Mor."],"kw":"aulas duracao modulos professor gravadas vivo tempo marketing vendas"},{"id":"MKT-008","p":"mkt","topic":"Aulas, duração e professor","n":8,"src":"RAG_Marketing_e_Vendas_neutra.docx","qRaw":"As aulas do Marketing e Vendas para Terapeutas são gravadas ou ao vivo?","q":"As aulas do Marketing e Vendas para Terapeutas são gravadas ou ao vivo?","v":[],"a":["Todas as aulas do curso Marketing e Vendas para Terapeutas são gravadas. Dessa forma você pode assistir todo o curso no seu próprio tempo e ritmo."],"kw":"aulas duracao modulos professor gravadas vivo tempo marketing vendas"},{"id":"MKT-009","p":"mkt","topic":"Certificado e provas","n":9,"src":"RAG_Marketing_e_Vendas_neutra.docx","qRaw":"O Marketing e Vendas para Terapeutas tem certificado?","q":"O Marketing e Vendas para Terapeutas tem certificado?","v":[],"a":["Sim, o curso Marketing e Vendas para Terapeutas possui certificado de conclusão."],"kw":"certificado mec prova teste marketing vendas","note":"A RAG da Black Friday diz que TRG Kids, Psicossomática e Marketing e Vendas não têm certificado; as RAGs desses cursos dizem que têm. Confirme com a coordenação antes de responder sobre certificado.","noteRefs":["BF-100","BF-101"]},{"id":"MKT-012","p":"mkt","topic":"Certificado e provas","n":12,"src":"RAG_Marketing_e_Vendas_neutra.docx","qRaw":"O Marketing e Vendas para Terapeutas tem prova ou teste?","q":"O Marketing e Vendas para Terapeutas tem prova ou teste?","v":[],"a":["Não há prova ou teste para o curso de Marketing e Vendas para Terapeutas."],"kw":"certificado mec prova teste marketing vendas"},{"id":"MKT-013","p":"mkt","topic":"Acesso e compartilhamento","n":13,"src":"RAG_Marketing_e_Vendas_neutra.docx","qRaw":"Posso compartilhar meu acesso ao Marketing e Vendas para Terapeutas com alguém?","q":"Posso compartilhar meu acesso ao Marketing e Vendas para Terapeutas com alguém?","v":[],"a":["Não. O acesso ao curso e o certificado são individuais e não podem ser compartilhados."],"kw":"acesso liberado compartilhar dividir marketing vendas"},{"id":"ONI-001","p":"onion","topic":"O que é o Onion","n":1,"src":"RAG_Onion_neutra.docx","qRaw":"O que é o Onion? | O que é o ONION e para que serve? | Me explica esse programa Onion, o que é isso? | O ONION é um curso? É uma formação? É terapia?","q":"O que é o Onion?","v":["O que é o ONION e para que serve?","Me explica esse programa Onion, o que é isso?","O ONION é um curso? É uma formação? É terapia?"],"a":["O Onion é um programa vivo de desenvolvimento humano, criado pelo professor Jair, voltado para pessoas comuns. Ele não é curso, não é formação e não é terapia. O propósito do Onion é ensinar pessoas a entender como o psiquismo funciona, a trabalhar seus padrões comportamentais e a reconhecer quando precisam de um especialista — ou seja, de um terapeuta TRG. Quando esse momento chega, o próprio programa direciona a pessoa ao TRG Club, onde os terapeutas formados estão disponíveis para atendimento. O Onion funciona como uma escola da vida real: educa sobre a mente, gera consciência e prepara as pessoas para buscar ajuda profissional quando necessário."],"kw":"onion app aplicativo escola vida real publico onion aplicativo app","note":"ONI-001 diz que o Onion é voltado para “pessoas comuns”; ONI-003 diz que foi criado para alunos e terapeutas TRG.","noteRefs":["ONI-003"]},{"id":"ONI-012","p":"onion","topic":"O que é o Onion","n":12,"src":"RAG_Onion_neutra.docx","qRaw":"O que é o ONION dentro do método TRG? | O que é a Escola da Vida Real do ONION? | Como funciona o aplicativo ONION?","q":"O que é o ONION dentro do método TRG?","v":["O que é a Escola da Vida Real do ONION?","Como funciona o aplicativo ONION?"],"a":["O ONION é um aplicativo criado dentro do ecossistema da TRG (Terapia de Reprocessamento Generativo) com o objetivo de conduzir o usuário a sair da Normose. Diferente de um curso convencional com começo e fim, o ONION funciona como uma estrutura viva e contínua: oferece trilhas de conteúdo organizadas em 6 fases, Varredura de Padrões, ferramentas práticas de prosperidade e conteúdo novo todos os dias. O aplicativo é acessível pelo celular e, futuramente, pelo computador. A proposta central é que o usuário melhore 1% a cada dia, de forma consistente e sustentada, saindo da reatividade (Normose) e construindo uma vida com autonomia, clareza e congruência — o que o método chama de se tornar Antifrágil."],"kw":"onion app aplicativo escola vida real publico onion aplicativo app"},{"id":"ONI-023","p":"onion","topic":"O que é o Onion","n":23,"src":"RAG_Onion_neutra.docx","qRaw":"Qual o objetivo do aplicativo Onion?","q":"Qual o objetivo do aplicativo Onion?","v":[],"a":["O Onion nasce para ser uma ferramenta que te auxilia a alcançar uma versão melhor de si mesmo todos os dias. Com o Onion você tem conteúdos diários que te ajudam a destravar sua mentalidade, te trazer mais clareza sobre determinados assuntos e ajustar o que “está fora do lugar” para sair da Normose e ser melhor a cada dia."],"kw":"onion app aplicativo escola vida real publico onion aplicativo app"},{"id":"ONI-002","p":"onion","topic":"O que é o Onion","n":2,"src":"RAG_Onion_neutra.docx","qRaw":"Por que o nome é Onion? | O que significa Onion? | Por que o aplicativo se chama Onion?","q":"Por que o nome é Onion?","v":["O que significa Onion?","Por que o aplicativo se chama Onion?"],"a":["O nome Onion é a abreviação de “O Novo Inconsciente”. Também faz referência a algo que o professor Jair sempre fala: cada pessoa e cada problema são compostos de camadas, e cada reprocessamento é como uma camada de cebola sendo removida. Onion significa cebola em inglês."],"kw":"onion app aplicativo escola vida real publico onion aplicativo app"},{"id":"ONI-003","p":"onion","topic":"O que é o Onion","n":3,"src":"RAG_Onion_neutra.docx","qRaw":"O Onion é para quem? | Qual público do Onion? | O aplicativo é para que tipo de pessoa?","q":"O Onion é para quem?","v":["Qual público do Onion?","O aplicativo é para que tipo de pessoa?"],"a":["O ONION foi criado para alunos e terapeutas TRG em qualquer estágio de formação e prática que desejam ser uma versão melhor de si mesmo todos os dias. Se você deseja sair da Normose e fazer parte da filosofia do 1% melhor todos os dias, então o Onion é para você."],"kw":"onion app aplicativo escola vida real publico onion aplicativo app","note":"ONI-001 diz que o Onion é voltado para “pessoas comuns”; ONI-003 diz que foi criado para alunos e terapeutas TRG.","noteRefs":["ONI-001"]},{"id":"ONI-009","p":"onion","topic":"Método: pilares, fases e conceitos","n":9,"src":"RAG_Onion_neutra.docx","qRaw":"O que são os 3 C's do ONION? | Quais são os três pilares do método ONION? | Como o ONION transforma consciência em prosperidade concreta? | Como o programa Onion é estruturado? | Quais são as etapas do Onion? Consciência, Congruência e Convivência?","q":"O que são os 3 C's do ONION?","v":["Quais são os três pilares do método ONION?","Como o ONION transforma consciência em prosperidade concreta?","Como o programa Onion é estruturado?","Quais são as etapas do Onion? Consciência, Congruência e Convivência?"],"a":["O Onion é estruturado em torno de três pilares chamados de 3 C's. O primeiro é *Consciência (C1)*: a pessoa entende como funciona o próprio psiquismo, o que é Normose e por que repete o que repete — são 34 aulas criadas pelo professor Jair, cada uma sobre um único conceito. O segundo é *Congruência (C2)*: a pessoa aprende a trabalhar seus padrões comportamentais com a Varredura de Padrões e aprende a distinguir padrão de transtorno — quando identifica algo mais profundo, o caminho é o terapeuta TRG. O terceiro é *Convivência (C3)*: uma comunidade organizada com grupos com propósito, onde pessoas crescem juntas, se apoiam, se cobram e se tornam divulgadoras naturais da TRG. Esses três pilares formam a base de toda a experiência dentro do programa."],"kw":"metodo pilares fases normose antifragil consciencia congruencia convivencia varredura padroes onion aplicativo app"},{"id":"ONI-007","p":"onion","topic":"Método: pilares, fases e conceitos","n":7,"src":"RAG_Onion_neutra.docx","qRaw":"O que é o pilar da Consciência no ONION? | Por que entender o psiquismo é o primeiro passo da transformação? | Como o autoconhecimento funciona dentro do método TRG/ONION?","q":"O que é o pilar da Consciência no ONION?","v":["Por que entender o psiquismo é o primeiro passo da transformação?","Como o autoconhecimento funciona dentro do método TRG/ONION?"],"a":["Consciência é o primeiro dos três pilares do ONION (C1) e representa a base de todo o processo de transformação. Nesse pilar, a pessoa aprende como o seu psiquismo opera — ou seja, como funciona por dentro, quais são os mecanismos inconscientes que governam seus comportamentos, emoções e decisões. Sem essa compreensão, a pessoa continua reagindo automaticamente à vida sem entender por que repete padrões, sabota conquistas ou trava em determinadas áreas. O pilar da Consciência corresponde principalmente às Fases 01 (O Inquieto) e 02 (O Desconstrutor) da jornada do ONION. Na primeira, a pessoa entende como funciona; na segunda, nomeia e reconhece a Normose em ação na própria vida."],"kw":"metodo pilares fases normose antifragil consciencia congruencia convivencia varredura padroes onion aplicativo app"},{"id":"ONI-006","p":"onion","topic":"Método: pilares, fases e conceitos","n":6,"src":"RAG_Onion_neutra.docx","qRaw":"O que é o pilar da Convivência no ONION? | Por que comunidade é importante para a transformação? | Como o grupo ajuda a sustentar a mudança no método ONION?","q":"O que é o pilar da Convivência no ONION?","v":["Por que comunidade é importante para a transformação?","Como o grupo ajuda a sustentar a mudança no método ONION?"],"a":["Convivência é o terceiro pilar do ONION (C3) e representa um princípio fundamental do método: a transformação verdadeira não se sustenta no isolamento. Depois de desenvolver consciência (C1) e alcançar congruência através da Varredura de Padrões (C2), a pessoa precisa de um ambiente que sustente e amplifique o que foi conquistado. O pilar da Convivência envolve comunidade, grupos regionais e o crescimento conjunto com pessoas que estão no mesmo caminho. Isso resolve um dos sintomas mais comuns da Normose — a sensação de estar cercado de gente mas sentir-se sozinho. No ONION, a convivência é estruturada através de comunidades e grupos regionais dentro do aplicativo, além de lideranças regionais que organizam o movimento localmente."],"kw":"metodo pilares fases normose antifragil consciencia congruencia convivencia varredura padroes onion aplicativo app"},{"id":"ONI-008","p":"onion","topic":"Método: pilares, fases e conceitos","n":8,"src":"RAG_Onion_neutra.docx","qRaw":"Quais são as 6 fases de evolução do Onion? | O que significam as fases do Inquieto ao Antifrágil? | Tem alguma fase de mentoria no Onion?","q":"Quais são as 6 fases de evolução do Onion?","v":["O que significam as fases do Inquieto ao Antifrágil?","Tem alguma fase de mentoria no Onion?"],"a":["O Onion possui 6 fases de evolução. *Fase 01 — O Inquieto*: a pessoa entende como o psiquismo funciona. *Fase 02 — O Desconstrutor*: reconhece padrões e descobre a Normose. *Fase 03 — O Reconstrutor*: pratica a Varredura de Padrões e aprende a distinguir comportamento de transtorno. *Fase 04 — O Explorador*: trabalha a prosperidade nas 7 áreas da vida. *Fase 05 — O Antifrágil*: age sobre a vida com autonomia real. *Fase 06 — Mentor (em breve)*: voltada para multiplicar, liderar e fazer parte do movimento. Essas fases representam uma jornada progressiva de autoconhecimento e desenvolvimento, sempre com a clareza de que questões emocionais profundas exigem acompanhamento de um terapeuta TRG."],"kw":"metodo pilares fases normose antifragil consciencia congruencia convivencia varredura padroes onion aplicativo app"},{"id":"ONI-004","p":"onion","topic":"Método: pilares, fases e conceitos","n":4,"src":"RAG_Onion_neutra.docx","qRaw":"O que significa o princípio de 1% melhor a cada dia no ONION? | Como o ONION usa consistência diária para gerar transformação? | Por que o ONION é uma estrutura viva e não um curso?","q":"O que significa o princípio de 1% melhor a cada dia no ONION?","v":["Como o ONION usa consistência diária para gerar transformação?","Por que o ONION é uma estrutura viva e não um curso?"],"a":["O princípio de 1% melhor a cada dia é um dos fundamentos operacionais do ONION. A ideia é que a transformação sustentável não acontece em grandes saltos motivacionais, mas em micro-avanços consistentes e diários. Esse princípio se materializa em várias ferramentas: o Áudio Diário (conteúdo novo a cada dia, disponível apenas naquele dia), os Micro-hábitos (ferramenta para instalar e melhorar hábitos progressivamente) e a própria estrutura do aplicativo, que evolui constantemente com novas trilhas, conteúdos e ferramentas. É por isso que o ONION não é um curso — um curso tem começo, meio e fim; o ONION é uma estrutura viva que cresce junto com o usuário. Essa abordagem combate diretamente um dos sintomas da Normose: a dependência de motivação externa. Em vez de depender de impulsos ou eventos motivacionais, o sistema do ONION cria um ritmo de crescimento que se auto sustenta, alinhado ao pilar Antifrágil de ter um sistema que sustenta sem depender de impulso."],"kw":"metodo pilares fases normose antifragil consciencia congruencia convivencia varredura padroes onion aplicativo app"},{"id":"ONI-011","p":"onion","topic":"Método: pilares, fases e conceitos","n":11,"src":"RAG_Onion_neutra.docx","qRaw":"O que é Normose na TRG? | Por que eu repito padrões mesmo sabendo o que precisa mudar? | Por que eu sei o que fazer mas não consigo fazer? | Como saber se a Normose ainda está ativa na minha vida?","q":"O que é Normose na TRG?","v":["Por que eu repito padrões mesmo sabendo o que precisa mudar?","Por que eu sei o que fazer mas não consigo fazer?","Como saber se a Normose ainda está ativa na minha vida?"],"a":["Normose é um conceito central da TRG que descreve um padrão de funcionamento inconsciente que opera por baixo da consciência e sabota a vida da pessoa mesmo quando ela se esforça. A Normose não é falta de vontade, inteligência ou esforço — é um sistema de crenças, marcas e programações que mantém a pessoa presa em ciclos repetitivos. Sinais típicos de Normose ativa incluem: clientes que não chegam (na vida profissional), relacionamentos que esfriam ou nunca se concretizam, desejo sexual que desaparece, sensação de solidão mesmo cercado de pessoas, saber o que fazer mas não conseguir executar, espiritualidade que virou obrigação, dinheiro que entra e não fica, e o hábito de cuidar de todos menos de si mesmo. Enquanto a Normose estiver no comando, a pessoa reage à vida em vez de agir sobre ela. A solução passa por identificar e desativar esses padrões na raiz, o que é feito através do processo estruturado nos três pilares do ONION (Consciência, Congruência e Convivência)."],"kw":"metodo pilares fases normose antifragil consciencia congruencia convivencia varredura padroes onion aplicativo app"},{"id":"ONI-010","p":"onion","topic":"Método: pilares, fases e conceitos","n":10,"src":"RAG_Onion_neutra.docx","qRaw":"Qual a diferença entre uma pessoa com Normose ativa e uma pessoa Antifrágil? | O que significa ser Antifrágil no contexto da TRG? | Como é a vida de alguém que saiu da Normose e se tornou Antifrágil?","q":"Qual a diferença entre uma pessoa com Normose ativa e uma pessoa Antifrágil?","v":["O que significa ser Antifrágil no contexto da TRG?","Como é a vida de alguém que saiu da Normose e se tornou Antifrágil?"],"a":["Na TRG, a diferença entre Normose ativa e o estado Antifrágil é a diferença entre reagir à vida e agir sobre ela. Uma pessoa com Normose ativa reage ao que acontece, faz terapia mas repete os mesmos padrões, sabe o diagnóstico mas não encontra a saída, cresce numa área e trava em outra, depende de motivação externa e, mesmo quando prospera parcialmente, sente que falta algo. Já a pessoa Antifrágil age sobre a vida com clareza, reprocessou na raiz o que a travava, combina consciência, método e ação diária, opera com um sistema que se sustenta sem depender de impulso e — o mais importante — cresce por causa do caos, não apesar dele. O conceito de antifragilidade na TRG significa que adversidades e desafios se tornam combustível para crescimento, em vez de serem ameaças que paralisam."],"kw":"metodo pilares fases normose antifragil consciencia congruencia convivencia varredura padroes onion aplicativo app"},{"id":"ONI-016","p":"onion","topic":"Método: pilares, fases e conceitos","n":16,"src":"RAG_Onion_neutra.docx","qRaw":"Qual a diferença entre padrão comportamental e transtorno emocional? | O que é padrão comportamental e o que é transtorno emocional no contexto do Onion? | Como o Onion ensina a pessoa a saber se precisa de terapeuta ou não? | Padrão e transtorno são a mesma coisa?","q":"Qual a diferença entre padrão comportamental e transtorno emocional?","v":["O que é padrão comportamental e o que é transtorno emocional no contexto do Onion?","Como o Onion ensina a pessoa a saber se precisa de terapeuta ou não?","Padrão e transtorno são a mesma coisa?"],"a":["São coisas distintas, e essa distinção é central no Onion. Padrão comportamental envolve hábitos repetitivos, crenças do dia a dia e reações automáticas — como procrastinação, medo de falar em público ou dificuldade com rotina. Isso vive na camada do comportamento e pode ser trabalhado com consciência, prática e repetição. Já transtorno emocional envolve marcas profundas: traumas, abuso, ansiedade generalizada, pânico, depressão. Isso tem raiz, tem lógica e não se desfaz com autoconhecimento na camada comportamental — precisa de acompanhamento profissional, como o de um terapeuta TRG formado. O Onion ensina o participante, ao longo de toda a jornada, a reconhecer quando está diante de um padrão que pode trabalhar sozinho e quando está diante de algo mais profundo que exige acompanhamento profissional. Essa clareza protege o trabalho do terapeuta e prepara o cliente para chegar ao consultório já consciente do que precisa."],"kw":"metodo pilares fases normose antifragil consciencia congruencia convivencia varredura padroes onion aplicativo app"},{"id":"ONI-017","p":"onion","topic":"Método: pilares, fases e conceitos","n":17,"src":"RAG_Onion_neutra.docx","qRaw":"O que é a Varredura de Padrões? | Varredura de Padrões é terapia? É reprocessamento? | Como funciona essa ferramenta de Varredura de Padrões do Onion? | A Varredura de Padrões substitui a TRG?","q":"O que é a Varredura de Padrões?","v":["Varredura de Padrões é terapia? É reprocessamento?","Como funciona essa ferramenta de Varredura de Padrões do Onion?","A Varredura de Padrões substitui a TRG?"],"a":["A Varredura de Padrões é a prática que o participante do Onion utiliza para identificar e trabalhar padrões comportamentais. Ela não é terapia, não é reprocessamento e não substitui o terapeuta TRG. É uma ferramenta de consciência voltada para a camada comportamental — e, ao mesmo tempo, funciona como um instrumento de identificação: quando a pessoa percebe que está diante de algo mais profundo do que um padrão, ela entende que precisa de um especialista. O programa conta com 42 temas de Varredura de Padrões, todos guiados, que ajudam o participante a descascar camadas e a ganhar clareza sobre o que pode resolver com prática e o que exige acompanhamento profissional."],"kw":"metodo pilares fases normose antifragil consciencia congruencia convivencia varredura padroes onion aplicativo app"},{"id":"ONI-005","p":"onion","topic":"Conteúdos e ferramentas","n":5,"src":"RAG_Onion_neutra.docx","qRaw":"Quais ferramentas práticas o ONION oferece no dia a dia? | O que são os micro-hábitos, áudio diário e mapa dos sonhos do ONION? | Como o ONION funciona na prática do cotidiano? | Quais recursos o participante do Onion recebe? | O que tem dentro do Onion? Quais são as ferramentas? | O que é o Áudio Diário, o Mapa dos Sonhos, o Concierge e os Micro-hábitos?","q":"Quais ferramentas práticas o ONION oferece no dia a dia?","v":["O que são os micro-hábitos, áudio diário e mapa dos sonhos do ONION?","Como o ONION funciona na prática do cotidiano?","Quais recursos o participante do Onion recebe?","O que tem dentro do Onion? Quais são as ferramentas?","O que é o Áudio Diário, o Mapa dos Sonhos, o Concierge e os Micro-hábitos?"],"a":["O Onion oferece um conjunto robusto de conteúdos e ferramentas. São 34 aulas de psiquismo (base), 42 temas de Varredura de Padrões, 6 fases de evolução (do Inquieto ao Antifrágil) e conteúdo novo todos os dias. Além disso, inclui: *Áudio Diário* — uma reflexão do professor Jair disponível apenas naquele dia, que provoca, questiona e mapeia pontos cegos. *Mapa dos Sonhos* — ferramenta para construir em imagens a vida que se quer viver. *Concierge Pessoal* — uma assistente dedicada ao processo de cada pessoa. *Micro-hábitos* — ferramenta para instalar e desenvolver hábitos com progressão real, seguindo a lógica de 1% melhor todo dia. Também há acesso a comunidades e grupos de convivência organizados."],"kw":"conteudos ferramentas aulas modulos audio diario trilhas micro habitos mapa sonhos concierge professor onion aplicativo app"},{"id":"ONI-024","p":"onion","topic":"Conteúdos e ferramentas","n":24,"src":"RAG_Onion_neutra.docx","qRaw":"Quais conteúdos possuem no aplicativo do Onion?","q":"Quais conteúdos possuem no aplicativo do Onion?","v":[],"a":["No aplicativo do Onion você tem conteúdos como: Áudios diários, vídeos com conteúdos variados, concierge para tirar dúvidas e te apoiar no uso e muito mais."],"kw":"conteudos ferramentas aulas modulos audio diario trilhas micro habitos mapa sonhos concierge professor onion aplicativo app"},{"id":"ONI-031","p":"onion","topic":"Conteúdos e ferramentas","n":31,"src":"RAG_Onion_neutra.docx","qRaw":"Quantas aulas tem o Onion? | Quantos conteúdos tem o Onion? | Quantas aulas tem no Onion atualmente? | O Onion já possui quantas aulas? | Qual total de aulas disponíveis no app Onion? | Há quantos módulos atualmente no Onion? | Qual total de aulas em cada módulo? | Tem quantas aulas nos módulos?","q":"Quantas aulas tem o Onion?","v":["Quantos conteúdos tem o Onion?","Quantas aulas tem no Onion atualmente?","O Onion já possui quantas aulas?","Qual total de aulas disponíveis no app Onion?","Há quantos módulos atualmente no Onion?","Qual total de aulas em cada módulo?","Tem quantas aulas nos módulos?"],"a":["O Onion, atualmente possui atualmente 83 aulas e 4 módulos. Essas aulas estão divididas da seguinte forma:","Módulo Introdução: 4 aulas","Módulo Normose: 10 aulas","Módulo Psiquismo: 34 aulas","Módulo Padrões: 35 aulas","Algumas aulas são divididas em parte 1 e 2 para que o aprendizado seja mais dinâmico.","Mais aulas e módulos serão liberados posteriormente."],"kw":"conteudos ferramentas aulas modulos audio diario trilhas micro habitos mapa sonhos concierge professor onion aplicativo app"},{"id":"ONI-028","p":"onion","topic":"Conteúdos e ferramentas","n":28,"src":"RAG_Onion_neutra.docx","qRaw":"O que são as trilhas do Onion?","q":"O que são as trilhas do Onion?","v":[],"a":["As trilhas presentes no aplicativo Onion são caminhos que possuem um tópico específico, como por exemplo: Problemas financeiros. Nessas trilhas você verá aulas que te ajudarão com esse tópico."],"kw":"conteudos ferramentas aulas modulos audio diario trilhas micro habitos mapa sonhos concierge professor onion aplicativo app"},{"id":"ONI-030","p":"onion","topic":"Conteúdos e ferramentas","n":30,"src":"RAG_Onion_neutra.docx","qRaw":"Qual frequência os conteúdos do Onion são postados?","q":"Qual frequência os conteúdos do Onion são postados?","v":[],"a":["Áudios - diariamente; Aulas - não há frequência fixa mas é postado com frequência."],"kw":"conteudos ferramentas aulas modulos audio diario trilhas micro habitos mapa sonhos concierge professor onion aplicativo app"},{"id":"ONI-026","p":"onion","topic":"Conteúdos e ferramentas","n":26,"src":"RAG_Onion_neutra.docx","qRaw":"Quem são os professores do Onion?","q":"Quem são os professores do Onion?","v":[],"a":["Atualmente todos os conteúdos do Onion são produzidos pelo professor Jair Soares, criador da TRG."],"kw":"conteudos ferramentas aulas modulos audio diario trilhas micro habitos mapa sonhos concierge professor onion aplicativo app"},{"id":"ONI-015","p":"onion","topic":"Onion e o terapeuta TRG","n":15,"src":"RAG_Onion_neutra.docx","qRaw":"O Onion vai tirar meus clientes? | Isso vai competir comigo? Vão roubar meu cliente? | Se as pessoas aprenderem sobre a mente no Onion, elas ainda vão precisar de terapeuta? | Tenho medo de que o Onion substitua o meu trabalho como terapeuta TRG.","q":"O Onion vai tirar meus clientes?","v":["Isso vai competir comigo? Vão roubar meu cliente?","Se as pessoas aprenderem sobre a mente no Onion, elas ainda vão precisar de terapeuta?","Tenho medo de que o Onion substitua o meu trabalho como terapeuta TRG."],"a":["O Onion não compete com o trabalho do terapeuta TRG — ele atua em uma camada completamente diferente. O Onion trabalha na camada comportamental, ajudando pessoas a identificar e lidar com padrões como procrastinação, medo de falar em público ou dificuldade com rotina. Já o terapeuta TRG atua na camada emocional profunda — traumas, abuso, ansiedade generalizada, pânico, depressão — onde só um profissional formado consegue intervir. Na prática, o Onion educa as pessoas sobre a TRG e direciona quem precisa de ajuda profissional para o TRG Club. Um dado relevante: 93% dos terapeutas TRG preferiram ser atendidos por outro terapeuta em vez de se auto-reprocessar. Se quem domina o método não dispensa o profissional, o público geral também não vai dispensar. O Onion não substitui o terapeuta: ele ajuda a encaminhar para o profissional quem precisa de acompanhamento."],"kw":"terapeuta clientes trg club concorrencia substitui onion aplicativo app"},{"id":"ONI-033","p":"onion","topic":"Onion e o terapeuta TRG","n":33,"src":"RAG_Onion_neutra.docx","qRaw":"O Onion substitui a terapia? | Posso usar o Onion no lugar de um terapeuta?","q":"O Onion substitui a terapia?","v":["Posso usar o Onion no lugar de um terapeuta?"],"a":["Não. O Onion é um programa de desenvolvimento humano que atua na camada comportamental. Questões emocionais mais profundas, como traumas, ansiedade, pânico ou depressão, exigem acompanhamento profissional. O próprio Onion ensina a reconhecer quando é hora de buscar um terapeuta TRG."],"kw":"terapeuta clientes trg club concorrencia substitui onion aplicativo app"},{"id":"ONI-018","p":"onion","topic":"Onion e o terapeuta TRG","n":18,"src":"RAG_Onion_neutra.docx","qRaw":"Como funciona a jornada da pessoa dentro do Onion até chegar ao terapeuta? | Qual o caminho que o cliente faz do Onion até o meu consultório? | Como a pessoa sai do programa e chega até o terapeuta?","q":"Como funciona a jornada da pessoa dentro do Onion até chegar ao terapeuta?","v":["Qual o caminho que o cliente faz do Onion até o meu consultório?","Como a pessoa sai do programa e chega até o terapeuta?"],"a":["A jornada funciona assim: primeiro, a pessoa entra no Onion e começa a entender como o psiquismo funciona, descobrindo o que é Normose. Em seguida, aprende a trabalhar padrões comportamentais com a Varredura de Padrões e sente resultados. Ao descascar as camadas, percebe que existem coisas mais profundas — marcas emocionais que não se movem com autoconhecimento. Como o programa inteiro a ensinou a distinguir padrão de transtorno, ela já sabe o que fazer: o app a direciona ao TRG Club. Ela chega até você não como alguém que viu um anúncio e não sabe o que é TRG, mas como alguém que já entende como a mente funciona, já sabe que emoção tem lógica, já confia na metodologia. Chega pronta para trabalhar."],"kw":"terapeuta clientes trg club concorrencia substitui onion aplicativo app"},{"id":"ONI-019","p":"onion","topic":"Onion e o terapeuta TRG","n":19,"src":"RAG_Onion_neutra.docx","qRaw":"Eu preciso entrar no Onion para me beneficiar dele? | Sou terapeuta TRG, sou obrigado a participar do Onion? | Se eu não entrar no Onion, ainda vou receber clientes? | Preciso pagar alguma coisa pra receber os clientes que vêm do Onion?","q":"Eu preciso entrar no Onion para me beneficiar dele?","v":["Sou terapeuta TRG, sou obrigado a participar do Onion?","Se eu não entrar no Onion, ainda vou receber clientes?","Preciso pagar alguma coisa pra receber os clientes que vêm do Onion?"],"a":["Não. Você não precisa estar dentro do Onion para se beneficiar dele. O programa vai funcionar para você de qualquer forma: as pessoas serão educadas sobre a TRG, quem identificar um transtorno será direcionado ao TRG Club, e se você está no TRG Club, vai receber esses clientes — já educados, já prontos. Você não precisa pagar nada, não precisa participar de nada. Só precisa continuar fazendo o que faz: atender com excelência. Entrar no Onion é uma escolha pessoal, não uma obrigação. Alguns terapeutas estão entrando porque querem liderar grupos, usar as ferramentas para a própria vida ou fazer parte do movimento desde o início."],"kw":"terapeuta clientes trg club concorrencia substitui onion aplicativo app"},{"id":"ONI-020","p":"onion","topic":"Onion e o terapeuta TRG","n":20,"src":"RAG_Onion_neutra.docx","qRaw":"Qual o efeito multiplicador do Onion? | Uma pessoa no Onion influencia outras pessoas ao redor? | Como o Onion ajuda a divulgar a TRG de forma orgânica?","q":"Qual o efeito multiplicador do Onion?","v":["Uma pessoa no Onion influencia outras pessoas ao redor?","Como o Onion ajuda a divulgar a TRG de forma orgânica?"],"a":["Cada pessoa que participa do Onion tende a influenciar as pessoas ao seu redor. Isso acontece porque a pessoa que fica no programa se desenvolve, melhora e se torna capaz de identificar padrões e transtornos nas pessoas próximas — no marido, no filho, na mãe, no colega de trabalho. E ela sabe exatamente onde essas pessoas podem encontrar ajuda: com um terapeuta TRG. Cada participante do Onion se torna uma divulgadora natural da TRG — não porque alguém pediu, mas porque viveu, entendeu e confia. Esse efeito multiplicador amplia o alcance da metodologia."],"kw":"terapeuta clientes trg club concorrencia substitui onion aplicativo app"},{"id":"ONI-021","p":"onion","topic":"Onion e o terapeuta TRG","n":21,"src":"RAG_Onion_neutra.docx","qRaw":"O Onion muda alguma coisa na minha formação TRG? | Minha formação como terapeuta TRG é afetada pelo Onion? | O TRG Club muda por causa do Onion? | O Onion substitui alguma coisa que já existe na TRG?","q":"O Onion muda alguma coisa na minha formação TRG?","v":["Minha formação como terapeuta TRG é afetada pelo Onion?","O TRG Club muda por causa do Onion?","O Onion substitui alguma coisa que já existe na TRG?"],"a":["Nada muda. A formação TRG continua igual. O TRG Club continua igual. O Onion é uma camada nova que foi adicionada ao ecossistema — ele não substitui nem altera nada que já existe. O programa existe para educar pessoas comuns sobre como a mente funciona e direcionar quem precisa de ajuda profissional para os terapeutas TRG. Sua formação, seus protocolos e sua atuação permanecem exatamente como são."],"kw":"terapeuta clientes trg club concorrencia substitui onion aplicativo app"},{"id":"ONI-022","p":"onion","topic":"Onion e o terapeuta TRG","n":22,"src":"RAG_Onion_neutra.docx","qRaw":"Por que o dado de 93% dos terapeutas é importante? | O que significa 93% dos terapeutas preferirem ser atendidos por outro terapeuta? | Se os próprios terapeutas não se auto-reprocessam, o que isso diz sobre o Onion? | O Onion vai fazer as pessoas acharem que não precisam de terapeuta?","q":"Por que o dado de 93% dos terapeutas é importante?","v":["O que significa 93% dos terapeutas preferirem ser atendidos por outro terapeuta?","Se os próprios terapeutas não se auto-reprocessam, o que isso diz sobre o Onion?","O Onion vai fazer as pessoas acharem que não precisam de terapeuta?"],"a":["Em uma pesquisa realizada diretamente com terapeutas TRG, 93% preferiram ser atendidos por outro terapeuta em vez de se auto-reprocessar. Esses são profissionais que dominam o método, entendem cada protocolo e sabem exatamente como tudo funciona — e ainda assim preferem ter alguém conduzindo o processo. Esse dado é importante porque demonstra que mesmo quem tem o conhecimento técnico completo reconhece o valor do acompanhamento profissional. Se terapeutas com centenas de horas de formação não dispensam o terapeuta, uma pessoa comum que aprendeu o básico sobre o psiquismo em um programa de desenvolvimento humano também não vai dispensar. O Onion não cria a ilusão de que a pessoa pode resolver tudo sozinha — pelo contrário, ele ensina a pessoa a reconhecer exatamente quando precisa de um profissional, e a direciona para o TRG Club."],"kw":"terapeuta clientes trg club concorrencia substitui onion aplicativo app"},{"id":"ONI-025","p":"onion","topic":"App, acesso e suporte","n":25,"src":"RAG_Onion_neutra.docx","qRaw":"O Onion é compatível com quais dispositivos? | O Onion funciona em quais sistemas operacionais?","q":"O Onion é compatível com quais dispositivos?","v":["O Onion funciona em quais sistemas operacionais?"],"a":["O Onion é um aplicativo mobile: você pode baixá-lo na loja de aplicativos do seu celular ou tablet, em dispositivos Android ou iOS."],"kw":"app aplicativo celular computador dispositivos android ios renovacao suporte contato onion aplicativo app"},{"id":"ONI-032","p":"onion","topic":"App, acesso e suporte","n":32,"src":"RAG_Onion_neutra.docx","qRaw":"Consigo usar o Onion no computador?","q":"Consigo usar o Onion no computador?","v":[],"a":["No momento, o Onion é um aplicativo para celular e tablet."],"kw":"app aplicativo celular computador dispositivos android ios renovacao suporte contato onion aplicativo app"},{"id":"ONI-013","p":"onion","topic":"App, acesso e suporte","n":13,"src":"RAG_Onion_neutra.docx","qRaw":"Não sou bom com tecnologia, o app é para mim? | Não sei mexer direito no celular, vou conseguir usar o app? | Vou conseguir usar o aplicativo com pouco conhecimento de celular?","q":"Não sou bom com tecnologia, o app é para mim?","v":["Não sei mexer direito no celular, vou conseguir usar o app?","Vou conseguir usar o aplicativo com pouco conhecimento de celular?"],"a":["O Aplicativo Onion foi pensado para que todos possam usa-lo independente de seu conhecimento de tecnologia/celular."],"kw":"app aplicativo celular computador dispositivos android ios renovacao suporte contato onion aplicativo app"},{"id":"ONI-014","p":"onion","topic":"App, acesso e suporte","n":14,"src":"RAG_Onion_neutra.docx","qRaw":"O Onion tem renovação? | O aplicativo vai ter renovação? | O aplicativo Onion tem renovação? | Posso renovar o Onion depois que acabar meu acesso?","q":"O Onion tem renovação?","v":["O aplicativo vai ter renovação?","O aplicativo Onion tem renovação?","Posso renovar o Onion depois que acabar meu acesso?"],"a":["Após expirar seu acesso no aplicativo Onion você poderá realizar a compra de uma renovação para manter seu acesso ativo. Ainda não há informações dos valores ou processo de renovação mas será possível renovar sim."],"kw":"app aplicativo celular computador dispositivos android ios renovacao suporte contato onion aplicativo app"},{"id":"ONI-027","p":"onion","topic":"App, acesso e suporte","n":27,"src":"RAG_Onion_neutra.docx","qRaw":"O Onion possui suporte técnico?","q":"O Onion possui suporte técnico?","v":[],"a":["Sim, o Onion possui um suporte técnico especializado disponível de segunda a sexta das 08:00 às 18:00 horas. Qualquer problema técnico você pode entrar em contato com eles através da aba “suporte” presente no seu aplicativo Onion."],"kw":"app aplicativo celular computador dispositivos android ios renovacao suporte contato onion aplicativo app"},{"id":"ONI-029","p":"onion","topic":"App, acesso e suporte","n":29,"src":"RAG_Onion_neutra.docx","qRaw":"Qual número de contato do suporte técnico do Onion?","q":"Qual número de contato do suporte técnico do Onion?","v":[],"a":["O número do suporte técnico do Onion é: +55 (81)98178-5519. Você também pode entrar em contato com o suporte técnico acessando a aba “suporte” no seu app. Ao clicar, você será redirecionado para nosso suporte técnico via whatsapp."],"kw":"app aplicativo celular computador dispositivos android ios renovacao suporte contato onion aplicativo app"}]}</script>

    var list = h("div", {class:"list"});
    arr.forEach(function(x){ list.appendChild(renderItem(x.it, {tag:true, preview:true, hl:r.hl, open:first})); first = false; });
    $list.appendChild(list);
  }
  if (pin.length){
    block("Principais sobre "+r.bundle.l, pin);
    block(res.length ? "Outras respostas próximas" : null, res);
  } else block(null, res);
}
function render(){
  $clear.hidden = !state.q;
  renderToc();
  if (state.q && lastSearch) renderSearch(); else renderBrowse();
}
var timer = null;
function onInput(now){
  clearTimeout(timer);
  timer = setTimeout(function(){
    state.q = $q.value.trim();
    lastSearch = state.q ? search(state.q) : null;
    if (state.q && !lastSearch) state.q = "";
    render();
    window.scrollTo({top:0});
  }, now === true ? 0 : 140);
}
function resetSearch(){ $q.value = ""; state.q = ""; lastSearch = null; }
function goTopic(pk, i, openAll){
  resetSearch();
  if (state.p !== "all" && state.p !== pk) state.p = pk;
  render();
  var t = document.getElementById(i < 0 ? "sec-"+pk : secId(pk,i));
  if (t){
    if (openAll) t.querySelectorAll(".qa").forEach(function(a){ setOpen(a, true); });
    t.scrollIntoView({block:"start"});
  }
  document.getElementById("tocM").open = false;
}
function goItem(id){
  var it = BYID[id]; if (!it) return;
  resetSearch();
  if (state.p !== "all" && state.p !== it.p) state.p = "all";
  render();
  var art = document.getElementById(id);
  if (art){ setOpen(art, true); art.scrollIntoView({block:"start"}); art.querySelector(".qa-head").focus({preventScroll:true}); }
}

$q.addEventListener("input", function(){ onInput(); });
$q.addEventListener("keydown", function(e){
  if (e.key === "Escape"){ resetSearch(); render(); }
  if (e.key === "Enter"){ var f = $list.querySelector(".qa-head"); if (f) f.focus(); }
});
$clear.addEventListener("click", function(){ resetSearch(); render(); $q.focus(); });
document.addEventListener("keydown", function(e){
  if (e.key === "/" && document.activeElement !== $q && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); $q.focus(); $q.select();
  }
});

/* Altura da barra fixa, para rolar sem esconder o título */
var bar = document.getElementById("bar");
function measure(){ document.documentElement.style.setProperty("--sticky-h", bar.offsetHeight+"px"); }
if (window.ResizeObserver) new ResizeObserver(measure).observe(bar); else window.addEventListener("resize", measure);
measure();
var sentinel = document.querySelector(".masthead");
if (window.IntersectionObserver) new IntersectionObserver(function(es){
  bar.classList.toggle("stuck", !es[0].isIntersecting);
}).observe(sentinel);

/* Rodapé com as fontes */
(function(){
  var f = document.getElementById("foot");
  var ul = h("ul");
  PRODUCTS.forEach(function(p){ ul.appendChild(h("li", {text:p.file+": "+p.count+" perguntas ("+p.prefix+"-001 a "+p.prefix+"-"+("00"+p.count).slice(-3)+")"})); });
  f.appendChild(h("h2", {text:"Fontes"}));
  f.appendChild(ul);
  f.appendChild(h("p", {text:"Perguntas e respostas foram extraídas automaticamente dos arquivos acima e conferidas uma a uma com o original. Nenhuma resposta foi reescrita. O código de cada pergunta indica a RAG e a posição dela no arquivo (BF-010 é a 10ª pergunta da RAG da Black Friday)."}));
  f.appendChild(h("p", {text:"Na tela, trechos entre *asteriscos* aparecem em negrito; o botão “Copiar resposta” mantém os asteriscos, que viram negrito no WhatsApp. Os avisos de divergência ficam fora do texto da resposta e não são copiados."}));
  f.appendChild(h("p", {text:"Atalhos: “/” vai para a busca, Esc limpa, Enter leva ao primeiro resultado. Você também pode buscar pelo código, como “BF-104”."}));
})();

render();
function fromHash(){ var id = decodeURIComponent(location.hash.slice(1)); if (BYID[id]) goItem(id); }
window.addEventListener("hashchange", fromHash);
fromHash();
})();
</script>
